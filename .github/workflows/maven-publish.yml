# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:  
          java-version: '21'
          distribution: 'corretto'
          cache: maven

    - name: Maven install
      run: mvn -q install -Dmaven.repo.local=./target/repo -DcreateChecksum=true

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::010112784456:role/github-quarkus-utils
        aws-region: eu-west-1

    - uses: jakejarvis/s3-sync-action@master
      name: Upload to S3
      env:
        AWS_S3_BUCKET: 'drwolf-maven-public'
        AWS_REGION: 'eu-west-1' 
        SOURCE_DIR: 'target/repo/com/github/drwolf-oss/${{ github.event.repository.name }}'
        DEST_DIR: 'com/github/drwolf-oss/${{ github.event.repository.name }}'
